<section
    id="projects-page"
    class="space-y-6"
>

    <!-- En-tête -->

    <div
        class="
            flex
            flex-col
            gap-4
            sm:flex-row
            sm:items-center
            sm:justify-between
        "
    >

        <div>

            <p
                class="
                    text-sm
                    font-medium
                    text-indigo-600
                    dark:text-indigo-400
                "
            >
                Gestionnaire
            </p>

            <h1
                class="
                    mt-1
                    text-2xl
                    font-bold
                    tracking-tight
                    text-slate-900
                    dark:text-white
                "
            >
                Mes projets
            </h1>

            <p
                class="
                    mt-1
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Organisez vos projets et suivez leur évolution.
            </p>

        </div>


        <button
             id="create-project-button"
            type="button"
            class="
                inline-flex
                items-center
                justify-center
                gap-2
                rounded-xl
                bg-indigo-600
                px-4
                py-2.5
                text-sm
                font-semibold
                text-white
                shadow-sm
                transition
                hover:bg-indigo-700
                focus:outline-none
                focus:ring-2
                focus:ring-indigo-500
                focus:ring-offset-2
            "
        >

            <span class="text-lg">
                +
            </span>

            Nouveau projet

        </button>

    </div>


    <!-- Barre de recherche -->

    <div
        class="
            rounded-2xl
            border
            border-slate-200
            bg-white
            p-4
            shadow-sm
            dark:border-slate-800
            dark:bg-slate-900
        "
    >

        <div
            class="
                flex
                flex-col
                gap-3
                md:flex-row
            "
        >

            <div
                class="
                    flex
                    flex-1
                    items-center
                    rounded-xl
                    border
                    border-slate-200
                    bg-slate-50
                    px-3
                    dark:border-slate-700
                    dark:bg-slate-950
                "
            >

                <span
                    class="text-slate-400"
                >
                    🔍
                </span>

                <input
                    id="project-search"
                    type="search"
                    placeholder="Rechercher un projet..."
                    class="
                        h-11
                        w-full
                        bg-transparent
                        px-3
                        text-sm
                        outline-none
                        placeholder:text-slate-400
                        dark:text-white
                    "
                >

            </div>


            <select
                id="project-status-filter"
                class="
                    h-11
                    rounded-xl
                    border
                    border-slate-200
                    bg-slate-50
                    px-4
                    text-sm
                    outline-none
                    dark:border-slate-700
                    dark:bg-slate-950
                    dark:text-white
                "
            >

                <option value="all">
                    Tous les projets
                </option>

                <option value="active">
                    Actifs
                </option>

                <option value="archived">
                    Archivés
                </option>

            </select>

        </div>

    </div>


    <!-- Statistiques -->

    <div
        class="
            grid
            grid-cols-1
            gap-4
            sm:grid-cols-3
        "
    >

        <div
            class="
                rounded-2xl
                border
                border-slate-200
                bg-white
                p-5
                shadow-sm
                dark:border-slate-800
                dark:bg-slate-900
            "
        >

            <p
                class="
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Total projets
            </p>

            <p
                id="total-projects"
                class="
                    mt-2
                    text-3xl
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                0
            </p>

        </div>


        <div
            class="
                rounded-2xl
                border
                border-slate-200
                bg-white
                p-5
                shadow-sm
                dark:border-slate-800
                dark:bg-slate-900
            "
        >

            <p
                class="
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Projets actifs
            </p>

            <p
                id="active-projects"
                class="
                    mt-2
                    text-3xl
                    font-bold
                    text-indigo-600
                "
            >
                0
            </p>

        </div>


        <div
            class="
                rounded-2xl
                border
                border-slate-200
                bg-white
                p-5
                shadow-sm
                dark:border-slate-800
                dark:bg-slate-900
            "
        >

            <p
                class="
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Projets archivés
            </p>

            <p
                id="archived-projects"
                class="
                    mt-2
                    text-3xl
                    font-bold
                    text-slate-500
                "
            >
                0
            </p>

        </div>

    </div>


    <!-- Liste des projets -->

    <div
        id="projects-list"
        class="
            grid
            grid-cols-1
            gap-5
            md:grid-cols-2
            xl:grid-cols-3
        "
    >
    </div>


    <!-- État vide -->

    <div
        id="projects-empty"
        class="
            hidden
            rounded-2xl
            border
            border-dashed
            border-slate-300
            bg-white
            p-12
            text-center
            dark:border-slate-700
            dark:bg-slate-900
        "
    >

        <div
            class="
                mx-auto
                flex
                h-16
                w-16
                items-center
                justify-center
                rounded-2xl
                bg-indigo-100
                text-2xl
                dark:bg-indigo-500/10
            "
        >
            📁
        </div>


        <h2
            class="
                mt-5
                text-lg
                font-bold
                text-slate-900
                dark:text-white
            "
        >
            Aucun projet
        </h2>


        <p
            class="
                mx-auto
                mt-2
                max-w-md
                text-sm
                text-slate-500
                dark:text-slate-400
            "
        >
            Créez votre premier projet pour commencer
            à organiser votre travail.
        </p>


        <button
            id="empty-add-project-button"
            type="button"
            class="
                mt-5
                rounded-xl
                bg-indigo-600
                px-4
                py-2.5
                text-sm
                font-semibold
                text-white
                hover:bg-indigo-700
            "
        >
            Créer un projet
        </button>
    
    </div>

</section>
