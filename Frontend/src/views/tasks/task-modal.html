<div
    id="task-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50"
>

    <div
        class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl"
    >

        <!-- En-tête -->

        <div class="mb-6 flex items-center justify-between">

            <h2 class="text-xl text-black font-semibold">
                Ajouter une tâche
            </h2>

            <button
                id="close-task-modal"
                type="button"
                class="text-gray-500 hover:text-gray-800"
            >
                &times;
            </button>

        </div>


        <!-- Formulaire -->

        <form id="task-form">

            <!-- Titre -->

            <div class="mb-4">

                <label
                    for="task-title"
                    class="mb-2 block text-sm text-black font-medium"
                >
                    Titre
                </label>

                <input
                    id="task-title"
                    name="title"
                    type="text"
                    required
                    class="w-full rounded-lg text-black border px-3 py-2"
                    placeholder="Ex : Créer la page d'accueil"
                >

            </div>


            <!-- Description -->

            <div class="mb-4">

                <label
                    for="task-description"
                    class="mb-2 block text-sm text-black font-medium"
                >
                    Description
                </label>

                <textarea
                    id="task-description"
                    name="description"
                    rows="4"
                    class="w-full rounded-lg text-black border px-3 py-2"
                    placeholder="Décrire la tâche..."
                ></textarea>

            </div>


            <!-- Priorité -->

            <div class="mb-4">

                <label
                    for="task-priority"
                    class="mb-2 block text-black text-sm font-medium"
                >
                    Priorité
                </label>

                <select
                    id="task-priority"
                    name="priority"
                    class="w-full rounded-lg text-black border px-3 py-2"
                >

                    <option value="low">
                        Faible
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Moyenne
                    </option>

                    <option value="high">
                        Haute
                    </option>

                </select>

            </div>


            <!-- Deadline -->

            <div class="mb-6">

                <label
                    for="task-deadline"
                    class="mb-2 block text-black text-sm font-medium"
                >
                    Deadline
                </label>

                <input
                    id="task-deadline"
                    name="deadline"
                    type="date"
                    class="w-full rounded-lg text-black border px-3 py-2"
                >

            </div>


            <!-- Boutons -->

            <div class="flex justify-end gap-3">

                <button
                    id="cancel-task-modal"
                    type="button"
                    class="rounded-lg border px-4 py-2 bg-red-400 text-black hover:bg-red-500"
                >
                    Annuler
                </button>

                <button
                    
                    type="submit"
                    class="rounded-lg border bg-blue-400 px-4 py-2 text-black hover:bg-blue-500"
                >
                    Créer la tâche
                </button>

            </div>

        </form>

    </div>

</div>
