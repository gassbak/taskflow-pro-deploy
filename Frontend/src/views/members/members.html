<section
    id="members-page"
    class="space-y-6"
>

    <!-- En-tête -->

    <div
        class="
            flex
            flex-col
            gap-4
            sm:flex-row
            sm:items-center
            sm:justify-between
        "
    >

        <div>

            <p
                class="
                    text-sm
                    font-medium
                    text-indigo-600
                    dark:text-indigo-400
                "
            >
                Équipe
            </p>

            <h1
                class="
                    mt-1
                    text-2xl
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                Membres
            </h1>

            <p
                class="
                    mt-2
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Gérez les personnes qui ont accès
                à votre espace de travail.
            </p>

        </div>

        <button
            id="add-member-button"
            type="button"
            class="
                inline-flex
                shrink-0
                items-center
                justify-center
                gap-2
                rounded-xl
                bg-indigo-600
                px-5
                py-3
                text-sm
                font-semibold
                text-white
                transition
                hover:bg-indigo-700
            "
        >
            + Ajouter un membre
        </button>

    </div>


    <!-- Liste des membres -->

    <div
        id="members-list"
        class="
            grid
            gap-4
            sm:grid-cols-2
            lg:grid-cols-3
        "
    >
        <!-- Les cartes membres sont injectées ici en JS -->
    </div>


    <!-- État vide -->

    <div
        id="members-empty-state"
        class="
            hidden
            rounded-2xl
            border
            border-dashed
            border-slate-300
            bg-white
            p-10
            text-center
            dark:border-slate-700
            dark:bg-slate-900
        "
    >

        <p class="text-3xl">👥</p>

        <p
            class="
                mt-3
                text-sm
                font-semibold
                text-slate-900
                dark:text-white
            "
        >
            Aucun membre pour le moment
        </p>

        <p
            class="
                mt-1
                text-sm
                text-slate-500
                dark:text-slate-400
            "
        >
            Ajoutez votre premier membre pour commencer.
        </p>

    </div>

</section>


<!-- Modal ajout / édition de membre -->

<div
    id="member-modal"
    class="
        fixed
        inset-0
        z-50
        hidden
        items-center
        justify-center
        bg-slate-900/50
        p-4
    "
>

    <div
        class="
            w-full
            max-w-md
            rounded-2xl
            bg-white
            p-6
            shadow-xl
            dark:bg-slate-900
        "
    >

        <div
            class="
                mb-5
                flex
                items-center
                justify-between
            "
        >

            <h2
                id="member-modal-title"
                class="
                    text-lg
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                Ajouter un membre
            </h2>

            <button
                id="close-member-modal"
                type="button"
                class="
                    flex
                    h-8
                    w-8
                    items-center
                    justify-center
                    rounded-lg
                    text-slate-400
                    hover:bg-slate-100
                    dark:hover:bg-slate-800
                "
                aria-label="Fermer"
            >
                ✕
            </button>

        </div>

        <form
            id="member-form"
            class="space-y-4"
        >

            <input
                type="hidden"
                id="member-id"
            >

            <div>

                <label
                    for="member-name"
                    class="
                        mb-1
                        block
                        text-sm
                        font-semibold
                        text-slate-700
                        dark:text-slate-300
                    "
                >
                    Nom
                </label>

                <input
                    id="member-name"
                    name="name"
                    type="text"
                    required
                    placeholder="Nom du membre"
                    class="
                        w-full
                        rounded-xl
                        border
                        border-slate-200
                        bg-white
                        px-4
                        py-3
                        text-sm
                        outline-none
                        transition
                        focus:border-indigo-500
                        focus:ring-2
                        focus:ring-indigo-500/20
                        dark:border-slate-700
                        dark:bg-slate-800
                        dark:text-white
                    "
                >

            </div>

            <div>

                <label
                    for="member-email"
                    class="
                        mb-1
                        block
                        text-sm
                        font-semibold
                        text-slate-700
                        dark:text-slate-300
                    "
                >
                    Email
                </label>

                <input
                    id="member-email"
                    name="email"
                    type="email"
                    placeholder="membre@exemple.com"
                    class="
                        w-full
                        rounded-xl
                        border
                        border-slate-200
                        bg-white
                        px-4
                        py-3
                        text-sm
                        outline-none
                        transition
                        focus:border-indigo-500
                        focus:ring-2
                        focus:ring-indigo-500/20
                        dark:border-slate-700
                        dark:bg-slate-800
                        dark:text-white
                    "
                >

            </div>

            <div>

                <label
                    for="member-role"
                    class="
                        mb-1
                        block
                        text-sm
                        font-semibold
                        text-slate-700
                        dark:text-slate-300
                    "
                >
                    Rôle
                </label>

                <select
                    id="member-role"
                    name="role"
                    class="
                        w-full
                        rounded-xl
                        border
                        border-slate-200
                        bg-white
                        px-4
                        py-3
                        text-sm
                        outline-none
                        transition
                        focus:border-indigo-500
                        focus:ring-2
                        focus:ring-indigo-500/20
                        dark:border-slate-700
                        dark:bg-slate-800
                        dark:text-white
                    "
                >
                    <option value="owner">Propriétaire</option>
                    <option value="admin">Administrateur</option>
                    <option value="member" selected>Membre</option>
                    <option value="viewer">Observateur</option>
                </select>

            </div>

            <div
                class="
                    flex
                    justify-end
                    gap-3
                    pt-2
                "
            >

                <button
                    id="cancel-member-modal"
                    type="button"
                    class="
                        rounded-xl
                        px-4
                        py-3
                        text-sm
                        font-semibold
                        text-slate-600
                        transition
                        hover:bg-slate-100
                        dark:text-slate-300
                        dark:hover:bg-slate-800
                    "
                >
                    Annuler
                </button>

                <button
                    type="submit"
                    class="
                        rounded-xl
                        bg-indigo-600
                        px-5
                        py-3
                        text-sm
                        font-semibold
                        text-white
                        transition
                        hover:bg-indigo-700
                    "
                >
                    Enregistrer
                </button>

            </div>

        </form>

    </div>

</div>
