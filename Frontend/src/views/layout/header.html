<header
    class="
        sticky
        top-0
        z-30
        flex
        h-20
        items-center
        justify-between
        border-b
        border-slate-200
        bg-white/95
        px-4
        backdrop-blur
        sm:px-6
        lg:ml-64
        lg:px-8
        dark:border-slate-800
        dark:bg-slate-950/95
    "
>

    <!-- Partie gauche -->

    <div
        class="
            flex
            items-center
            gap-3
        "
    >

        <!-- Bouton mobile -->

        <button
            id="mobile-menu-button"
            type="button"
            class="
                flex
                h-10
                w-10
                items-center
                justify-center
                rounded-xl
                text-xl
                text-slate-600
                hover:bg-slate-100
                lg:hidden
                dark:text-slate-300
                dark:hover:bg-slate-800
            "
            aria-label="Ouvrir le menu"
        >
            ☰
        </button>


        <div>

            <p
                class="
                    text-xs
                    font-medium
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Espace de travail
            </p>

            <h2
                class="
                    text-lg
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                Mon espace
            </h2>

        </div>

    </div>


    <!-- Partie droite -->

    <div
        class="
            flex
            items-center
            gap-2
            sm:gap-3
        "
    >

        <!-- Recherche -->

        <div
            class="
                hidden
                items-center
                rounded-xl
                border
                border-slate-200
                bg-slate-50
                px-3
                sm:flex
                dark:border-slate-700
                dark:bg-slate-900
            "
        >

            <span
                class="
                    mr-2
                    text-slate-400
                "
            >
                🔍
            </span>

            <input
                type="search"
                placeholder="Rechercher..."
                class="
                    h-10
                    w-32
                    bg-transparent
                    text-sm
                    outline-none
                    placeholder:text-slate-400
                    md:w-48
                "
            >

        </div>


       <!-- Notifications -->

<div class="relative">

    <button
        id="notification-button"
        type="button"
        class="
            relative
            flex
            h-10
            w-10
            items-center
            justify-center
            rounded-xl
            text-lg
            text-slate-600
            transition
            hover:bg-slate-100
            dark:text-slate-300
            dark:hover:bg-slate-800
        "
        aria-label="Notifications"
        aria-expanded="false"
    >

        🔔

        <span
            id="notification-count"
            class="
                absolute
                right-1
                top-1
                hidden
                h-4
                min-w-4
                items-center
                justify-center
                rounded-full
                bg-red-500
                px-1
                text-[9px]
                font-bold
                text-white
            "
        >
            0
        </span>

    </button>


    <!-- Menu notifications -->

    <div
        id="notification-panel"
        class="
            absolute
            right-0
            top-12
            z-50
            hidden
            w-80
            overflow-hidden
            rounded-2xl
            border
            border-slate-200
            bg-white
            shadow-xl
            dark:border-slate-700
            dark:bg-slate-900
            sm:w-96
        "
    >

        <!-- En-tête -->

        <div
            class="
                flex
                items-center
                justify-between
                border-b
                border-slate-200
                px-4
                py-3
                dark:border-slate-700
            "
        >

            <div>

                <h3
                    class="
                        text-sm
                        font-bold
                        text-slate-900
                        dark:text-white
                    "
                >
                    Notifications
                </h3>

                <p
                    id="notification-summary"
                    class="
                        text-xs
                        text-slate-500
                        dark:text-slate-400
                    "
                >
                    Aucune notification
                </p>

            </div>


            <button
                id="mark-all-notifications"
                type="button"
                class="
                    text-xs
                    font-medium
                    text-indigo-600
                    hover:text-indigo-700
                    dark:text-indigo-400
                "
            >
                Tout lire
            </button>

        </div>


        <!-- Liste -->

        <div
            id="notification-list"
            class="
                max-h-96
                overflow-y-auto
            "
        >

            <div
                class="
                    px-4
                    py-8
                    text-center
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Aucune notification
            </div>

        </div>

    </div>

</div>


        <!-- Séparateur -->

        <div
            class="
                hidden
                h-8
                w-px
                bg-slate-200
                sm:block
                dark:bg-slate-700
            "
        ></div>


        <!-- Avatar -->

        <button
            type="button"
            data-page="profile"
            class="
                flex
                items-center
                gap-2
                rounded-xl
                p-1.5
                transition
                hover:bg-slate-100
                dark:hover:bg-slate-800
            "
        >

            <span
                data-user-initials
                class="
                    flex
                    h-9
                    w-9
                    items-center
                    justify-center
                    rounded-full
                    bg-indigo-600
                    text-xs
                    font-bold
                    text-white
                "
            >
                ?
            </span>


            <span
                data-user-name
                class="
                    hidden
                    text-sm
                    font-semibold
                    text-slate-700
                    md:block
                    dark:text-slate-200
                "
            >
                Utilisateur
            </span>

        </button>

    </div>

</header>
