<section
    id="settings-page"
    class="space-y-6"
>

    <!-- En-tête -->

    <div>

        <p
            class="
                text-sm
                font-medium
                text-indigo-600
                dark:text-indigo-400
            "
        >
            Configuration
        </p>

        <h1
            class="
                mt-1
                text-2xl
                font-bold
                text-slate-900
                dark:text-white
            "
        >
            Paramètres
        </h1>

        <p
            class="
                mt-2
                text-sm
                text-slate-500
                dark:text-slate-400
            "
        >
            Personnalisez votre expérience
            sur TaskFlow Pro.
        </p>

    </div>


    <!-- Apparence -->

    <div
        class="
            rounded-2xl
            border
            border-slate-200
            bg-white
            p-6
            shadow-sm
            dark:border-slate-800
            dark:bg-slate-900
        "
    >

        <div class="mb-5">

            <h2
                class="
                    text-lg
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                Apparence
            </h2>

            <p
                class="
                    mt-1
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Choisissez l'apparence de
                votre espace de travail.
            </p>

        </div>


        <div class="grid gap-4 sm:grid-cols-2">

            <!-- Mode clair -->

            <button
                id="theme-light"
                type="button"
                class="
                    rounded-xl
                    border
                    border-slate-200
                    p-4
                    text-left
                    transition
                    hover:border-indigo-500
                    hover:bg-slate-50
                    dark:border-slate-700
                    dark:hover:bg-slate-800
                "
            >

                <div class="text-2xl">
                    ☀️
                </div>

                <h3
                    class="
                        mt-3
                        font-semibold
                        text-slate-900
                        dark:text-white
                    "
                >
                    Mode clair
                </h3>

                <p
                    class="
                        mt-1
                        text-xs
                        text-slate-500
                        dark:text-slate-400
                    "
                >
                    Utiliser une interface claire.
                </p>

            </button>


            <!-- Mode sombre -->

            <button
                id="theme-dark"
                type="button"
                class="
                    rounded-xl
                    border
                    border-slate-200
                    p-4
                    text-left
                    transition
                    hover:border-indigo-500
                    hover:bg-slate-50
                    dark:border-slate-700
                    dark:hover:bg-slate-800
                "
            >

                <div class="text-2xl">
                    🌙
                </div>

                <h3
                    class="
                        mt-3
                        font-semibold
                        text-slate-900
                        dark:text-white
                    "
                >
                    Mode sombre
                </h3>

                <p
                    class="
                        mt-1
                        text-xs
                        text-slate-500
                        dark:text-slate-400
                    "
                >
                    Utiliser une interface sombre.
                </p>

            </button>

        </div>

    </div>


    <!-- Notifications -->

    <div
        class="
            rounded-2xl
            border
            border-slate-200
            bg-white
            p-6
            shadow-sm
            dark:border-slate-800
            dark:bg-slate-900
        "
    >

        <div class="mb-5">

            <h2
                class="
                    text-lg
                    font-bold
                    text-slate-900
                    dark:text-white
                "
            >
                Notifications
            </h2>

            <p
                class="
                    mt-1
                    text-sm
                    text-slate-500
                    dark:text-slate-400
                "
            >
                Gérez les notifications de
                votre espace de travail.
            </p>

        </div>


        <div class="space-y-4">

            <label
                class="
                    flex
                    cursor-pointer
                    items-center
                    justify-between
                    gap-4
                "
            >

                <div>

                    <p
                        class="
                            text-sm
                            font-semibold
                            text-slate-900
                            dark:text-white
                        "
                    >
                        Notifications
                    </p>

                    <p
                        class="
                            text-xs
                            text-slate-500
                            dark:text-slate-400
                        "
                    >
                        Recevoir les notifications
                        de TaskFlow Pro.
                    </p>

                </div>

                <input
                    id="setting-notifications"
                    type="checkbox"
                    checked
                    class="
                        h-5
                        w-5
                        rounded
                        border-slate-300
                        text-indigo-600
                    "
                >

            </label>


            <label
                class="
                    flex
                    cursor-pointer
                    items-center
                    justify-between
                    gap-4
                "
            >

                <div>

                    <p
                        class="
                            text-sm
                            font-semibold
                            text-slate-900
                            dark:text-white
                        "
                    >
                        Rappels de deadlines
                    </p>

                    <p
                        class="
                            text-xs
                            text-slate-500
                            dark:text-slate-400
                        "
                    >
                        Recevoir un rappel lorsqu'une
                        deadline approche.
                    </p>

                </div>

                <input
                    id="setting-deadlines"
                    type="checkbox"
                    checked
                    class="
                        h-5
                        w-5
                        rounded
                        border-slate-300
                        text-indigo-600
                    "
                >

            </label>

        </div>

    </div>


    <!-- Enregistrement -->

    <div class="flex justify-end">

        <button
            id="save-settings"
            type="button"
            class="
                rounded-xl
                bg-indigo-600
                px-5
                py-3
                text-sm
                font-semibold
                text-white
                transition
                hover:bg-indigo-700
            "
        >
            Enregistrer les paramètres
        </button>

    </div>

</section>
